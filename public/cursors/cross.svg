<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="crossGlow">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <line x1="16" y1="2" x2="16" y2="12" stroke="#7ab8a0" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="16" y2="30" stroke="#7ab8a0" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="12" y2="16" stroke="#7ab8a0" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="20" y1="16" x2="30" y2="16" stroke="#7ab8a0" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="7" stroke="#7ab8a0" stroke-width="1.2" fill="none" opacity="0.5"/>
  <circle cx="16" cy="16" r="2" fill="#7ab8a0" opacity="0.9" filter="url(#crossGlow)"/>
  <circle cx="16" cy="16" r="0.8" fill="#fff" opacity="0.6"/>
</svg>
